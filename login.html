<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inloggen — Velaro</title>
  <link rel="stylesheet" href="src/styles/index.css">
</head>
<body>

<div class="auth-layout">

  <!-- Background network dots (subtle) -->
  <svg style="position:absolute;inset:0;width:100%;height:100%;opacity:.04;pointer-events:none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="1" fill="#D8BD71"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#dots)"/>
  </svg>

  <div class="auth-card">

    <!-- Logo -->
    <div class="auth-logo">
      <img src="velaro_logo.png" alt="Velaro">
    </div>

    <!-- Badge -->
    <div class="hero-tag" style="margin: 0 auto 32px; width: fit-content; display: inline-flex; position: relative; left: 50%; transform: translateX(-50%);">
      Exclusief Platform · Besloten Toegang
    </div>

    <!-- Heading -->
    <h1 class="auth-heading">Welkom <em>terug</em></h1>
    <p class="auth-sub">Log in op uw Velaro-account</p>

    <!-- Form -->
    <form id="login-form" novalidate>

      <div class="form-group">
        <label class="form-label" for="email">E-mailadres</label>
        <input
          class="input"
          id="email"
          type="email"
          placeholder="uw@email.nl"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Wachtwoord</label>
        <input
          class="input"
          id="password"
          type="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        >
      </div>

      <div class="form-row">
        <a href="#" class="form-link">Wachtwoord vergeten?</a>
      </div>

      <button type="submit" class="btn-primary btn-primary--full">
        Inloggen
      </button>

    </form>

    <div class="auth-divider">of</div>

    <div class="auth-footer">
      Nog geen account? <a href="#">Toegang aanvragen</a>
    </div>

  </div>
</div>

<script>
  document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = this.querySelector('button[type="submit"]');
    btn.textContent = 'Inloggen…';
    btn.style.opacity = '0.7';
    btn.disabled = true;
    setTimeout(() => {
      btn.textContent = 'Inloggen';
      btn.style.opacity = '';
      btn.disabled = false;
    }, 1500);
  });
</script>

</body>
</html>
